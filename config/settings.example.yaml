# 复制为 config/settings.yaml 并填真实参数（settings.yaml 不入库）。
# 成本模型来自卖家实拍成本表，已按例子验证（含税价4,300,000₩ → 得物成本¥17,067.37）。

# ============ 汇率 KRW per CNY ============
fx:
  source: naver        # naver | alipay | manual（实时获取失败回退到 krw_per_cny）
  krw_per_cny: 224     # 手填/回退值；1 CNY ≈ 224 KRW

# ============ 采购成本（韩国买入 → 得物入库）============
cost:
  # 得物采购成本(KRW) = 含税价 × (10/11 − voucher_rate + export_filing_rate)
  voucher_rate: 0.03        # 商品券折扣率（新世界/乐天/现代，明珍线下约3%，按当日实际填）
  export_filing_rate: 0.01  # 得物需自行出口申报，找第三方约1%含税价
  # 去税系数固定 10/11（韩国 VAT 10%），写死在代码
  logistics:                # 物流：中程(按重量) + 顺丰 + 包装
    rate_cny_per_kg:        # 中程单价（物流单 2026/06 报价）
      shoes: 200
      default: 38           # 小皮具(钱包/皮带)
    weight_kg:              # 单件估重（用于算中程）
      shoes: 1.5
      wallet: 0.4
      belt: 0.5
      default: 0.5
    sf_express_cny: 50      # 中程2 顺丰快递
    packaging_cny: 20       # 包装（顺丰时价）

# ============ 得物销售侧费用 ============
sell:
  tech_fee_rate_normal: 0.05      # 普通挂单 技术服务费 5%
  tech_fee_rate_instant: 0.01     # 立即变现 技术服务费 至多降至 1%
  transfer_fee_rate: 0.01         # 转账手续费 1%
  operation_fee_cny: 38           # 操作服务费
  buyer_shipping_subsidy_cny: 8.72  # 消费者邮费补贴 8~12
  worryfree_fee_rate: 0.015       # 售后无忧 1.5%（不固定）
  include_worryfree: false        # 是否计入售后无忧
  # 立即变现卖的是最高求购价，无独立接口时按 市场最低价×(1−此折让) 近似
  instant_bid_discount: 0.06
  prefer_scenario: best           # best | normal | instant：用哪个利润进榜（best=两者取高）

# ============ 选品评分权重 ============
scoring:
  weights:
    margin_rate: 0.30
    abs_profit: 0.25
    sales_speed: 0.25
    stock_stability: 0.10
    competition: 0.10
    capital_tied: 0.05
    price_volatility: 0.05
  filters:
    min_abs_profit_cny: 80
    min_margin_rate: 0.08
    require_lv_sellable: true
